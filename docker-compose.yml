version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./competitor_spy.db
      - MAX_WORKERS=10
      - REQUEST_TIMEOUT=15
    volumes:
      - ./backend/competitor_spy.db:/app/competitor_spy.db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
